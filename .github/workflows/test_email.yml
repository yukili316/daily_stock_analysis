name: 邮件发送测试

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 发送测试邮件
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          from src.config import get_config
          from src.notification_sender.email_sender import EmailSender

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          config = get_config()
          fields = {
              "EMAIL_SENDER": config.email_sender or "",
              "EMAIL_PASSWORD": config.email_password or "",
          }
          fields.update({
              f"EMAIL_RECEIVERS[{index}]": receiver
              for index, receiver in enumerate(config.email_receivers)
          })
          for field, value in fields.items():
              try:
                  value.encode("ascii")
              except UnicodeEncodeError:
                  raise SystemExit(f"{field} 包含非 ASCII 字符，请删除中文标点、说明文字或引号")
          if "@" not in fields["EMAIL_SENDER"]:
              raise SystemExit("EMAIL_SENDER 不是有效邮箱地址")
          for index, receiver in enumerate(config.email_receivers):
              if "@" not in receiver:
                  raise SystemExit(f"EMAIL_RECEIVERS[{index}] 不是有效邮箱地址")

          sender = EmailSender(config)
          sent = sender.send_to_email(
              "# 邮件配置测试\n\n"
              "GitHub Actions 已成功连接 SMTP 服务并发送此邮件。\n\n"
              f"测试时间：{now}",
              subject="daily_stock_analysis 邮件配置测试",
              timeout_seconds=30,
          )
          if not sent:
              raise SystemExit("测试邮件发送失败，请检查 SMTP 授权码和邮箱设置")
          print("测试邮件发送成功")
          PY
